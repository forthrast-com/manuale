name: Publish Manuale

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write
  # Reading a previous run's calendar artifact when the cache has expired.
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Calendar edition
        id: edition
        run: echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: calendar-cache
        with:
          path: |
            vendor
            data
          key: manuale-${{ runner.os }}-${{ steps.edition.outputs.year }}-${{ hashFiles('sources.json', 'source_patches.json', 'tools/fetch_source.py', 'tools/generate.py', 'tools/liturgy.py', 'flake.lock') }}
          # Reuse the source checkout and any still-valid day packs when the
          # importer changes. The year stays in the prefix so a rollover starts
          # clean rather than inheriting packs from outside the new range.
          restore-keys: |
            manuale-${{ runner.os }}-${{ steps.edition.outputs.year }}-
      # Action caches are evicted after seven days unused, so the monthly run
      # would always start cold. The artifact outlives that gap; a run that
      # misses the cache reuses the packs whose hashes still match instead of
      # regenerating two years from nothing.
      - name: Restore the last published calendar, if the cache is gone
        if: steps.calendar-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=calendar-data&per_page=1" \
                 --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -z "$id" ]; then echo "No retained calendar to restore."; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > calendar.zip
          mkdir -p data && unzip -q -o calendar.zip -d data && rm calendar.zip
          echo "Restored $(find data/days -name '*.json.gz' | wc -l) day packs from artifact $id."

      - name: Generate the current and following calendar years
        run: nix develop --command make data

      # Packs are already gzipped, so asking for more compression only costs time.
      - name: Retain the calendar for later runs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calendar-data
          path: data
          retention-days: 90
          compression-level: 0
          overwrite: true
      - name: Verify and build
        run: nix develop --command sh -c 'make test && make build'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          # The action defaults to one day, which leaves nothing to inspect or
          # roll back to after a bad deploy.
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
